<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Gesture Shooter - Fixed Aim</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; }
        
        /* 视频层 */
        #input_video { 
            position: absolute; width: 100%; height: 100%; object-fit: cover; 
            transform: scaleX(-1); z-index: 1; opacity: 0; 
        }
        
        /* 游戏层 */
        #output_canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 2; transform: scaleX(-1); 
        }

        #ui_layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;
            pointer-events: none;
        }

        #score_board {
            position: absolute; top: 20px; left: 20px;
            color: #0ff; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 10px #0ff;
        }

        #start_screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: auto;
        }
        
        button {
            padding: 15px 40px; font-size: 24px; background: #ff0055; color: white;
            border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px #ff0055; margin-top: 20px;
        }
        button:active { transform: scale(0.95); }

        .floater {
            position: absolute; font-weight: 900; font-size: 30px;
            animation: floatUp 0.8s ease-out forwards; pointer-events: none;
            text-shadow: 2px 2px 0 #000; white-space: nowrap;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="ui_layer">
        <div id="score_board">SCORE: <span id="score_val">0</span></div>
    </div>

    <div id="start_screen">
        <h1 style="color:white; margin-bottom:10px;">AR 街机射击 (修正版)</h1>
        <p style="color:#aaa; text-align: center; line-height: 1.6;">
            👈 食指瞄准 | 👍 大拇指射击<br>
            已修复准星追踪问题
        </p>
        <button id="start_btn" disabled>加载中...</button>
        <div id="loading" style="color:white; margin-top:10px; font-size:12px;">正在初始化 MediaPipe...</div>
    </div>
</div>

<script>
const MP_VERSION = '0.4.1646424915';
const MP_BASE_URL = `https://unpkg.com/@mediapipe/hands@${MP_VERSION}/`;

const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const scoreEl = document.getElementById('score_val');
const startBtn = document.getElementById('start_btn');
const startScreen = document.getElementById('start_screen');

let scene, camera, renderer;
let score = 0;
let enemies = [];
const ENEMY_COUNT = 5; 
let audioCtx;
let isPlaying = false;
let handLandmarks = null;
let lastShotTime = 0;
const SHOT_COOLDOWN = 300; 

const BOUNDS_X = 14; 
const BOUNDS_Y = 10;

// --- 1. Three.js 初始化 ---
function initThree() {
    scene = new THREE.Scene();
    const aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 20;
    
    // 确保相机的配置和第一版完全一致
    camera = new THREE.OrthographicCamera(
        frustumSize * aspect / -2, frustumSize * aspect / 2,
        frustumSize / 2, frustumSize / -2, 
        0.1, 1000
    );
    camera.position.z = 10;

    renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 5, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    createReticle();
    createLaser();
    window.addEventListener('resize', onWindowResize, false);
}

let reticleMesh, laserLine;

function createReticle() {
    const geometry = new THREE.RingGeometry(0.3, 0.45, 32);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 });
    reticleMesh = new THREE.Mesh(geometry, material);
    scene.add(reticleMesh);
}

function createLaser() {
    const material = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2, opacity: 0.5, transparent: true });
    const points = [new THREE.Vector3(0, -10, 0), new THREE.Vector3(0, 0, 0)];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    laserLine = new THREE.Line(geometry, material);
    scene.add(laserLine);
}

function onWindowResize() {
    const aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 20;
    camera.left = -frustumSize * aspect / 2;
    camera.right = frustumSize * aspect / 2;
    camera.top = frustumSize / 2;
    camera.bottom = -frustumSize / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- 2. 敌人逻辑 ---
function spawnEnemy() {
    if (enemies.length >= ENEMY_COUNT) return;

    const geometry = new THREE.CylinderGeometry(0.9, 0.9, 0.15, 32);
    geometry.rotateX(Math.PI / 2); 
    const material = new THREE.MeshPhongMaterial({ color: getRandomColor() });
    const enemy = new THREE.Mesh(geometry, material);

    const direction = Math.random() > 0.5 ? 1 : -1; 
    const startX = direction === 1 ? -BOUNDS_X - 2 : BOUNDS_X + 2;
    const startY = (Math.random() - 0.5) * (BOUNDS_Y * 1.5);

    enemy.position.set(startX, startY, 0);
    enemy.userData = { 
        dirX: direction,
        speedX: 0.04 + Math.random() * 0.04, 
        waveAmp: 0.02 + Math.random() * 0.03, 
        timeOffset: Math.random() * 100 
    };

    scene.add(enemy);
    enemies.push(enemy);
}

function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        
        e.position.x += e.userData.dirX * e.userData.speedX;
        e.position.y += Math.sin(e.position.x * 2 + e.userData.timeOffset) * e.userData.waveAmp;
        e.rotation.z += 0.05;
        e.rotation.x += 0.02;

        let isOut = false;
        if (e.userData.dirX === 1 && e.position.x > BOUNDS_X + 2) isOut = true;
        if (e.userData.dirX === -1 && e.position.x < -BOUNDS_X - 2) isOut = true;

        if (isOut) {
            let missX = e.userData.dirX === 1 ? BOUNDS_X : -BOUNDS_X;
            triggerVisualEffect("ESCAPED", missX, e.position.y, '#ff4444'); 
            scene.remove(e);
            enemies.splice(i, 1);
            spawnEnemy(); 
        }
    }
    while(enemies.length < ENEMY_COUNT) spawnEnemy();
}

function getRandomColor() {
    const colors = [0xff0055, 0x00aaff, 0xffff00, 0x00ff00, 0xffaa00];
    return colors[Math.floor(Math.random() * colors.length)];
}

// --- 3. 音效与视觉特效 ---
function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }
}

function triggerVisualEffect(text, x, y, color) {
    const div = document.createElement('div');
    div.className = 'floater';
    div.innerText = text;
    div.style.color = color;
    
    const widthHalf = window.innerWidth / 2;
    const heightHalf = window.innerHeight / 2;
    const frustumHeight = 20;
    const frustumWidth = frustumHeight * (window.innerWidth / window.innerHeight);
    
    let screenX = (x / (frustumWidth/2)) * widthHalf + widthHalf;
    const screenY = -(y / (frustumHeight/2)) * heightHalf + heightHalf;
    
    screenX = window.innerWidth - screenX; 
    screenX = Math.max(50, Math.min(window.innerWidth - 50, screenX));
    screenY = Math.max(50, Math.min(window.innerHeight - 50, screenY));

    div.style.left = `${screenX}px`;
    div.style.top = `${screenY}px`;
    document.getElementById('ui_layer').appendChild(div);
    setTimeout(() => div.remove(), 800);
}

// --- 4. MediaPipe ---
function initMediaPipe() {
    const hands = new Hands({
        locateFile: (file) => `${MP_BASE_URL}${file}`
    });
    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1, // 关键修复：改回高精度模式
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    hands.onResults((results) => {
        handLandmarks = results.multiHandLandmarks && results.multiHandLandmarks.length > 0 
            ? results.multiHandLandmarks[0] : null;
    });

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => await hands.send({image: videoElement}),
        width: 1280, height: 720 // 关键修复：改回高分辨率输入
    });

    startBtn.disabled = false;
    startBtn.innerText = "开始游戏";
    document.getElementById('loading').style.display = 'none';

    startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        initAudio();
        isPlaying = true;
        cameraUtils.start();
        animate();
    });
}

// --- 5. 游戏主逻辑 ---
function processGameLogic() {
    // 默认位置改为中心 (0,0,0) 而不是底部，这样即使追踪丢失也不会卡在最下面
    let targetPos = new THREE.Vector3(0, 0, 0); 
    let isShooting = false;
    let hitEnemy = null;
    let hasHand = false;

    if (handLandmarks) {
        hasHand = true;
        const frustumHeight = 20;
        const frustumWidth = frustumHeight * (window.innerWidth / window.innerHeight);
        
        const indexTip = handLandmarks[8];
        const thumbTip = handLandmarks[4];
        const indexBase = handLandmarks[5];
        const wrist = handLandmarks[0];

        // 关键修复：使用第一版的坐标计算公式
        const rawX = (indexTip.x - 0.5) * frustumWidth;
        const rawY = -(indexTip.y - 0.5) * frustumHeight;
        let aimPos = new THREE.Vector3(rawX, rawY, 0);

        // 磁吸
        let closestDist = 999;
        let magneticTarget = null;
        for (let e of enemies) {
            const dist = aimPos.distanceTo(e.position);
            if (dist < 3.5 && dist < closestDist) {
                closestDist = dist;
                magneticTarget = e;
            }
        }
        if (magneticTarget) {
            aimPos.lerp(magneticTarget.position, 0.4); 
            reticleMesh.material.color.setHex(0xff0055); 
            reticleMesh.scale.setScalar(0.8);
            hitEnemy = magneticTarget;
        } else {
            reticleMesh.material.color.setHex(0x00ff00); 
            reticleMesh.scale.setScalar(1.0);
        }
        targetPos = aimPos;

        const triggerDist = Math.hypot(thumbTip.x - indexBase.x, thumbTip.y - indexBase.y);
        if (triggerDist < 0.05) {
            const now = Date.now();
            if (now - lastShotTime > SHOT_COOLDOWN) {
                isShooting = true;
                lastShotTime = now;
            }
        }

        // 激光
        const wristX = (wrist.x - 0.5) * frustumWidth;
        const wristY = -(wrist.y - 0.5) * frustumHeight;
        const posAttr = laserLine.geometry.attributes.position;
        posAttr.setXYZ(0, wristX, wristY, 0);
        posAttr.setXYZ(1, targetPos.x, targetPos.y, 0);
        posAttr.needsUpdate = true;
    } else {
        // 没检测到手时，隐藏准心和激光，而不是让它卡在底部
        reticleMesh.visible = false;
        laserLine.visible = false;
    }

    if (hasHand) {
        reticleMesh.visible = true;
        laserLine.visible = true;
        reticleMesh.position.copy(targetPos);

        if (isShooting) {
            playSound('shoot');
            reticleMesh.scale.set(1.5, 1.5, 1);
            setTimeout(() => reticleMesh.scale.set(1, 1, 1), 100);

            if (hitEnemy) {
                playSound('hit');
                triggerVisualEffect("HIT!", hitEnemy.position.x, hitEnemy.position.y, '#ffff00');
                score += 100;
                scoreEl.innerText = score;
                scene.remove(hitEnemy);
                enemies = enemies.filter(e => e !== hitEnemy);
                spawnEnemy();
            } else {
                triggerVisualEffect("MISS", targetPos.x, targetPos.y, '#cccccc');
            }
        }
    }
}

function animate() {
    requestAnimationFrame(animate);
    if (isPlaying) {
        updateEnemies();
        processGameLogic();
        renderer.render(scene, camera);
    }
}

initThree();
initMediaPipe();
</script>
</body>
</html>
